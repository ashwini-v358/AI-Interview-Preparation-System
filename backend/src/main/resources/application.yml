server:
  port: 8080

spring:
  application:
    name: smart-interview-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai:
    # mock  = fully deterministic, no API key needed (default for local dev and tests)
    # gemini= real Google Gemini generation, with automatic MockAIService fallback
    provider: ${AI_PROVIDER:mock}
    # Backend-only secret. Never expose this to the frontend.
    # Accepts AI_API_KEY or GEMINI_API_KEY; resolved only at runtime from the environment.
    api-key: ${AI_API_KEY:${GEMINI_API_KEY:}}
    # When true, any Gemini failure is served by MockAIService instead of failing the request.
    fallback-enabled: ${AI_FALLBACK_ENABLED:true}
    gemini:
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    max-context-chars: ${AI_MAX_CONTEXT_CHARS:24000}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}

---
# MySQL Profile (Production / Docker / Standard Local MySQL)
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_interview?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

---
# Local In-Memory H2 Profile (Zero-dependency local dev & testing)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:smartinterview;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
